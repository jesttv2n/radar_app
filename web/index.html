<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nedbørsradar · TV2 Nord</title>
<link rel="stylesheet" href="radar.css">
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #f5f5f8; color: #1a1a2e;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p { margin: 0 0 16px; color: #6666aa; }
  .tv2nord-radar { --tv2nord-radar-height: min(72vh, 680px); }
</style>
</head>
<body>
<main>
  <h1>Nedbørsradar</h1>
  <p>De seneste to timers regn og en prognose for den næste time.</p>
  <div data-tv2nord-radar data-src="https://services.tv2nord.dk/radar/data/" data-cooperative="false"></div>
</main>
<script>
  // ?src=/sti/ peger widgetten på andre data (kun samme origin, til lokal test)
  (function () {
    var s = new URLSearchParams(location.search).get("src");
    if (s && s.charAt(0) === "/" && s.charAt(1) !== "/") {
      document.querySelector("[data-tv2nord-radar]").setAttribute("data-src", s);
    }
  })();
</script>
<script src="radar.js"></script>
</body>
</html>
