<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nedbørsradar · TV2 Nord</title>
<script>
  // Som tv2nord.dk: class="dark" på <html> efter prefers-color-scheme, også ved live-skift
  (function () {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.classList.toggle("dark", mq.matches); }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<link rel="stylesheet" href="radar.css">
<style>
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
</style>
</head>
<body class="rd:m-0 rd:bg-light rd:px-4 rd:pt-6 rd:pb-12 rd:font-sans rd:text-ink rd:dark:bg-night rd:dark:text-white">
<main class="rd:mx-auto rd:max-w-[1100px]">
  <h1 class="rd:mt-0 rd:mb-1 rd:text-2xl rd:font-bold">Nedbørsradar</h1>
  <p class="rd:mt-0 rd:mb-4 rd:text-current/70">De seneste to timers regn og en prognose for den næste time.</p>
  <div data-tv2nord-radar data-src="https://services.tv2nord.dk/radar/data/" data-cooperative="false"></div>
</main>
<script>
  // ?src=/sti/ peger widgetten på andre data (kun samme origin, til lokal test)
  (function () {
    var s = new URLSearchParams(location.search).get("src");
    if (s && s.charAt(0) === "/" && s.charAt(1) !== "/") {
      document.querySelector("[data-tv2nord-radar]").setAttribute("data-src", s);
    }
  })();
</script>
<script src="radar.js"></script>
</body>
</html>
