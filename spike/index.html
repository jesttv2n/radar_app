<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar-spike</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg: #f4f5f7; --fg: #1d2330; --muted: #667085; --line: #d6d9e0; --accent: #c8102e; --fc: #2a5bd7; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .maps { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line); min-height: 0; }
  .pane { position: relative; }
  .pane > .map { position: absolute; inset: 0; }
  .tag { position: absolute; top: 10px; left: 10px; z-index: 2; background: #fff; padding: 4px 10px; border-radius: 6px; font-weight: 600; box-shadow: 0 1px 3px #0003; }
  .tag.fc { color: var(--fc); } .tag.obs { color: var(--accent); }
  footer { background: #fff; border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #slider { flex: 1; min-width: 200px; }
  #time { font-variant-numeric: tabular-nums; min-width: 190px; font-weight: 600; }
  #score { font-variant-numeric: tabular-nums; color: var(--muted); }
  .legend { display: flex; align-items: center; gap: 1px; font-size: 11px; color: var(--muted); }
  .legend span { width: 22px; height: 10px; display: inline-block; }
  @media (max-width: 700px) { .maps { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Radar-spike: DMI composite + pysteps</h1>
  <label>Case <select id="case"></select></label>
  <label>Prognose <select id="method">
    <option value="sprog">S-PROG</option>
    <option value="extrapolation">Ren advektion</option>
    <option value="persistence">Persistens (frosset billede)</option>
  </select></label>
  <div class="legend" id="legend"></div>
</header>
<div class="maps">
  <div class="pane"><div class="tag fc" id="leftTag">Prognose</div><div class="map" id="mapL"></div></div>
  <div class="pane"><div class="tag obs">Observeret</div><div class="map" id="mapR"></div></div>
</div>
<footer>
  <button id="play">▶</button>
  <input type="range" id="slider" min="0" max="0" step="1">
  <div id="time"></div>
  <div id="score"></div>
</footer>
<script>
const LEVELS = [10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
const COLORS = ["#a6e3ff","#5ab4f0","#2a7fd4","#1f4fa8","#2fae3c","#f2e030","#f5a623","#e8452c","#b81f5b","#7a1fa2"];
document.getElementById("legend").innerHTML = "dBZ&nbsp;" + COLORS.map((c, i) => `<span style="background:${c}" title="${LEVELS[i]}+ dBZ"></span>`).join("") + "&nbsp;55+";

const STATIONS = { "Sindal": [10.13511, 57.48876], "Samsø": [10.58549, 55.81201], "Rømø": [8.55053, 55.17259], "Stevns": [12.44817, 55.32562], "Bornholm": [14.88746, 55.11283] };
const style = {
  version: 8,
  sources: { base: { type: "raster", tileSize: 256, tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
    attribution: "© OpenStreetMap · Radardata: DMI (CC BY 4.0)" } },
  layers: [{ id: "base", type: "raster", source: "base", paint: { "raster-saturation": -0.8 } }]
};
const mk = id => new maplibregl.Map({ container: id, style, center: [9.9, 57.0], zoom: 6.6, attributionControl: { compact: true } });
const maps = [mk("mapL"), mk("mapR")];
let syncing = false;
maps.forEach((m, i) => m.on("move", () => {
  if (syncing) return; syncing = true;
  const o = maps[1 - i]; o.jumpTo({ center: m.getCenter(), zoom: m.getZoom(), bearing: m.getBearing(), pitch: m.getPitch() });
  syncing = false;
}));
maps.forEach(m => Object.entries(STATIONS).forEach(([n, ll]) => {
  const el = document.createElement("div");
  el.style.cssText = "width:9px;height:9px;border-radius:50%;background:#c8102e;border:2px solid #fff;box-shadow:0 0 2px #000";
  el.title = `Radar ${n}`;
  new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(m);
}));

let manifest, idx = 0, timer;
const $ = id => document.getElementById(id);
const fmt = iso => new Date(iso).toLocaleString("da-DK", { timeZone: "Europe/Copenhagen", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function setImage(map, url) {
  const src = map.getSource("radar");
  if (src) src.updateImage({ url, coordinates: manifest.coordinates });
  else {
    map.addSource("radar", { type: "image", url, coordinates: manifest.coordinates });
    map.addLayer({ id: "radar", type: "raster", source: "radar", paint: { "raster-fade-duration": 0, "raster-resampling": "nearest", "raster-opacity": 0.75 } });
  }
}

function render() {
  const f = manifest.frames[idx], base = `out/${manifest.case}/`, method = $("method").value;
  const isFc = f.lead > 0;
  setImage(maps[0], base + (isFc ? f[method] : f.obs));
  setImage(maps[1], base + f.obs);
  $("leftTag").textContent = isFc ? `Prognose (${$("method").selectedOptions[0].text})` : "Observeret (historik)";
  $("time").textContent = `${fmt(f.time)} · ${f.lead > 0 ? "+" : ""}${f.lead} min`;
  if (isFc) {
    const s = manifest.scores[method], k = f.lead / manifest.step_minutes - 1;
    $("score").textContent = `CSI(≥1 mm/t) ${s.csi_1mm[k].toFixed(2)} · FSS(10 km) ${s.fss_1mm_10km[k].toFixed(2)}`;
  } else $("score").textContent = f.lead === 0 ? "Prognosen starter her" : "";
}

async function loadCase(c) {
  manifest = await (await fetch(`out/${c}/manifest.json`)).json();
  manifest.frames.forEach(f => Object.values(f).forEach(v => { if (typeof v === "string" && v.endsWith(".png")) new Image().src = `out/${c}/${v}`; }));
  $("slider").max = manifest.frames.length - 1;
  idx = manifest.frames.findIndex(f => f.lead === 0);
  $("slider").value = idx;
  render();
}

(async () => {
  const cases = await (await fetch("out/cases.json")).json();
  $("case").innerHTML = cases.map(c => `<option>${c}</option>`).join("");
  await Promise.all(maps.map(m => m.loaded() ? null : new Promise(r => m.on("load", r))));
  await loadCase(cases[0]);
})();
$("case").onchange = e => loadCase(e.target.value);
$("method").onchange = render;
$("slider").oninput = e => { idx = +e.target.value; render(); };
$("play").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶"; return; }
  $("play").textContent = "❚❚";
  timer = setInterval(() => { idx = (idx + 1) % manifest.frames.length; $("slider").value = idx; render(); }, 700);
};
</script>
</body>
</html>
