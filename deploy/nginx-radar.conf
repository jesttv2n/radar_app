# radar / Nedbørsradar - offentlig, statisk (ingen backend-port). Data skrives af radar-worker.timer.
location = /radar { return 301 /radar/; }
location = /radar/data/manifest.json {
    alias /var/lib/radar/public/manifest.json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
}
location ^~ /radar/data/ {
    alias /var/lib/radar/public/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=86400, immutable" always;
}
location ^~ /radar/ {
    alias /var/www/services/radar/web/;
    index index.html;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}
